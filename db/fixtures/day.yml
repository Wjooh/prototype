deliveries:
  # Windows: 30m pickup, 30–60m drive, 1h dropoff (timeline).
  # arrived_at / eta: live tracking vs fixture `now` (deliveries UI).
  # Each stop: load = into car, unload = out of car. Cargo must balance per ride.
  # Own-stock leaves from TADAAA as a supplier pickup (not hub place).
  - id: d_hack_hub_morning
    kind: swiftee
    cost_pence: 1800
    stops:
      - position: 1
        place: supplier
        supplier_id: tadaaa
        pickup_start: "08:00"
        pickup_end: "08:30"
        arrived_at: "08:07"
        load:
          - hi_cups
          - hi_plates
          - hi_napkins
          - hi_coffee
          - hi_forks
          - hi_milk
          - hi_prosecco
          - hi_oj
          - hi_corona
          - hi_pellegrino
          - hi_coke
          - hi_water_still
          - hi_water_spark
          - hi_white_wine
          - hi_red_wine
      - position: 2
        place: customer
        order_id: hackathon
        dropoff_start: "09:15"
        dropoff_end: "10:15"
        arrived_at: "09:22"
        unload:
          - hi_cups
          - hi_plates
          - hi_napkins
          - hi_coffee
          - hi_forks
          - hi_milk
          - hi_prosecco
          - hi_oj
          - hi_corona
          - hi_pellegrino
          - hi_coke
          - hi_water_still
          - hi_water_spark
          - hi_white_wine
          - hi_red_wine
